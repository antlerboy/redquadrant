name: Publish RedQuadrant website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore verified owned assets
        run: python3 scripts/fetch-owned-assets.py
      - name: Publish maintained programme record
        run: python3 scripts/sync-programme-record.py
      - name: Build static website
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx next build
      - name: Install browser regression runner
        run: |
          npm install --prefix /tmp/rq-browser --no-save playwright@1.64.1
          /tmp/rq-browser/node_modules/.bin/playwright install chromium
      - name: Reject background buttons and check motion preferences
        env:
          NODE_PATH: /tmp/rq-browser/node_modules
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node tests/home-background.browser.cjs
      - name: Record publication identity
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('out/website-publication.json').write_text(json.dumps({'commit': os.environ['RELEASE_SHA'], 'background_controls': 'none'}, indent=2) + '\n')
          PY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

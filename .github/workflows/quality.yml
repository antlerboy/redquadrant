name: Check website changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build static website
        env:
          GITHUB_PAGES_BASE_PATH: /redquadrant
        run: npm run build:pages
      - name: Install browser regression runner
        run: |
          npm install --prefix /tmp/rq-browser --no-save playwright@1.64.1
          /tmp/rq-browser/node_modules/.bin/playwright install chromium
      - name: Reject background buttons and check motion preferences
        env:
          NODE_PATH: /tmp/rq-browser/node_modules
          GITHUB_PAGES_BASE_PATH: /redquadrant
        run: node tests/home-background.browser.cjs
